name: Build SM-T860 SDCC2 register diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sm-t860-first-boot-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out the exact reviewed tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Set up fixed Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install fixed-host build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates clang curl gcc-aarch64-linux-gnu \
            gettext git gnupg iasl lld llvm locales mono-devel nasm \
            python3-git python3-pip python3-venv uuid-dev
          curl -fL --retry 3 --output "$RUNNER_TEMP/nuget.exe" \
            https://dist.nuget.org/win-x86-commandline/v6.11.1/nuget.exe
          echo 'c0ddc9cb0633c4607da7e8028eb4f91248c8b74e45a68b0c79fcfa7d78c2a481  nuget.exe' \
            | (cd "$RUNNER_TEMP" && sha256sum -c -)
          sudo install -d -m 0755 /opt/t860-tools
          sudo install -m 0644 "$RUNNER_TEMP/nuget.exe" /opt/t860-tools/nuget.exe
          sudo install -m 0755 implementation/uefi/nuget-mono.sh /usr/local/bin/nuget
          python3 --version
          clang --version
          aarch64-linux-gnu-gcc --version
          mono --version
          command -v nuget

      - name: Verify reviewed SDCC2 register diagnostic inputs
        shell: bash
        run: sha256sum -c SD-FIRST-2412.74-INPUTS.sha256

      - name: Build exact 2412.74 source with read-only SDCC2 diagnostics
        run: ./implementation/uefi/build-sd-first-2412.74.sh

      - name: Freeze artifact checksums
        shell: bash
        run: |
          set -euo pipefail
          output=implementation/build/uefi-sdcc2-registers-2412.74
          (
            cd "$output"
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' \
              | LC_ALL=C sort \
              | while read -r file; do sha256sum "$file"; done \
              > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - name: Upload non-deployable diagnostic evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sm-t860-2412.74-sdcc2-registers-${{ github.sha }}
          path: implementation/build/uefi-sdcc2-registers-2412.74/
          if-no-files-found: error
          retention-days: 3
